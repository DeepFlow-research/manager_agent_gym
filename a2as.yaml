manifest:
  version: "0.1.2"
  schema: https://a2as.org/cert/schema
  subject:
    name: deepflow-research/manager_agent_gym
    source: https://github.com/deepflow-research/manager_agent_gym
    branch: main
    commit: "3f7a5d4a"
    scope: [manager_agent_gym/core/workflow_agents/ai_agent.py, manager_agent_gym/core/workflow_agents/human_agent.py, manager_agent_gym/core/workflow_agents/interface.py,
      manager_agent_gym/core/workflow_agents/registry.py, manager_agent_gym/core/workflow_agents/stakeholder_agent.py, manager_agent_gym/core/workflow_agents/tool_factory.py,
      manager_agent_gym/core/workflow_agents/tools/communication.py, manager_agent_gym/core/workflow_agents/tools/communication_di.py,
      manager_agent_gym/core/workflow_agents/tools/web_search/__init__.py, manager_agent_gym/core/workflow_agents/tools/web_search/main.py,
      manager_agent_gym/core/workflow_agents/tools/web_search/search.py, manager_agent_gym/schemas/execution/manager_actions.py]
  issued:
    by: A2AS.org
    at: '2026-01-26T16:15:12Z'
  signatures:
    digest: sha256:EbGl68QsO89WlDN0d4hQtkC904ZkMF_AET-bSBdOl9A
    key: ed25519:0JbZ5TgBtAWDt_7Xh1qK1tN_LKYQucwDkhNM7j4hEuI
    sig: ed25519:5mzb2Yc-jwQMRAe-UGhAXigtBWJr_0Rebvv2w-G7sAtatrPHsRDr0h7eoDFHSMz1R5ShAmbqp595XPF-75ugBA

agents:
  agent.0:
    type: instance
    models: [LitellmModel]
    tools: [self.tools]
    params:
      class: AIAgent
      name: config.agent_id
      output_type: AITaskOutput
      instance: agent
  agent.1:
    type: instance
    models: [LitellmModel]
    tools: [self.private_tools]
    params:
      class: MockHumanAgent
      name: '{config.name}_roleplay'
      output_type: HumanWorkOutput
      instance: agent
      instructions: [roleplay_prompt]
  agent.StakeholderAgent._stakeholder_agent:
    type: class
    models: [LitellmModel]
    tools: [self.tools]
    params:
      class: StakeholderAgent
      name: self.config.agent_id
      output_type: AITaskOutput
      instructions: [self._build_system_prompt()]
  time_estimation_agent:
    type: instance
    models: [LitellmModel]
    params:
      function: _estimate_human_duration
      name: '{self.config.name}_time_estimator'
      output_type: HumanTimeEstimation
      instructions: ['You are {self.config.role} with {self.config.experience_years} years of experience.', Your task is to
          estimate how long it would take YOU SPECIFICALLY to complete the given task., 'Consider:', '- Your background: {self.config.background}',
        '- Your expertise areas: {, .join}', '- Your work style: {self.config.work_style}', '- Your personality traits: {,
          .join}', '- Realistic time for research, planning, execution, and review', '- Potential challenges you might face
          given your background', 'Be realistic - include time for breaks, getting up to speed, and potential obstacles.',
        'Don''t just estimate the "ideal" time, but the real time it would take you personally.']

models:
  LitellmModel:
    type: function
    agents: [agent.StakeholderAgent._stakeholder_agent, time_estimation_agent, agent.0, agent.1]

tools:
  analyze_data:
    type: decorator
    params:
      description: |-
        Analyze the provided data and extract insights.

        Args:
            data: The data to analyze

        Returns:
            Analysis results
  broadcast_message:
    type: decorator
    params:
      description: |-
        Send a broadcast message to all agents in the workflow.

        Use this for announcements, status updates, or information that
        all team members should know about. The message will be automatically
        linked to your current task.

        Args:
            content: The message content to broadcast
            message_type: Type of message - "broadcast", "alert", "status_update"

        Returns:
            Confirmation message

        Example:
            await broadcast_message(
                content="Database optimization is 75% complete, ETA 30 minutes",
                message_type="status_update"
            )
  calculate_metrics:
    type: decorator
    params:
      description: |-
        Calculate performance metrics from data.

        Args:
            data: Input data for metrics calculation

        Returns:
            Calculated metrics
  consult_colleague:
    type: decorator
    params:
      description: |-
        Consult with a colleague about a work topic.

        Args:
            topic: The topic to discuss

        Returns:
            Colleague's advice
  end_workflow:
    type: decorator
    params:
      description: |-
        Request to end the workflow execution immediately after the current step.

        Should be only ever called by the manager agent when it thinks the workflow is complete and there is no further work to be done.

        Args:
            reason: Optional reason for termination

        Returns:
            Confirmation string
  generate_code:
    type: decorator
    params:
      description: |-
        Generate code based on a description.

        Args:
            description: Description of what the code should do

        Returns:
            Generated code
  get_conversation_with:
    type: decorator
    params:
      description: |-
        Get conversation history with a specific agent.

        Use this to review past communications with another agent
        to understand context or continue a conversation.

        Args:
            other_agent_id: The ID of the other agent
            limit: Maximum number of messages to retrieve (1-50)

        Returns:
            Formatted conversation history

        Example:
            history = await get_conversation_with("manager_agent", limit=10)
  get_recent_messages:
    type: decorator
    params:
      description: |-
        Retrieve recent messages sent to you.

        Use this to check for updates, questions, or communications from
        other agents that might be relevant to your current work.

        Args:
            limit: Maximum number of messages to retrieve (1-50)
            since_minutes: How many minutes back to look for messages (1-1440)
            message_types: Types to include - "all", "direct", "request", "broadcast", or comma-separated list

        Returns:
            Formatted list of recent messages

        Example:
            recent = await get_recent_messages(limit=5, since_minutes=30, message_types="request,direct")
  get_search_context:
    type: decorator
    params:
      description: |-
        Perform a real-time web search to answer a user's question with up-to-date information and citations.

        This asynchronous function takes a user's search question, queries the web for recent and relevant results,
        synthesizes the findings, and returns a structured answer that includes inline citations to the sources.

        Note: Before calling this tool, make sure you tell the user you are going to do a web search.
        Parameters:
            question (QuestionRequest):
                The search request containing:
                    - query (str): The user's search query.
                    - return_results_from (str): ISO 8601 date string specifying the earliest date for search results.
                    - domain (SearchDomain): The content domain to restrict the search (e.g., news, academic, general).

        Returns:
            SearchResult:
                An object containing a comprehensive answer to the query, with inline citations referencing the sources used.

        Usage:
            Call this tool when you need context from the web to complete a user task.
  get_task_messages:
    type: decorator
    params:
      description: |-
        Get messages related to a specific task.

        Use this to see all communications about a particular task,
        which can help understand requirements, progress, or issues.

        Args:
            task_id: The task ID to get messages for (defaults to current task)

        Returns:
            Formatted list of task-related messages

        Example:
            task_comms = await get_task_messages()  # Current task
            task_comms = await get_task_messages("task-uuid-here")  # Specific task
  search_information:
    type: decorator
    params:
      description: |-
        Search for information on a given topic.

        Args:
            query: The search query

        Returns:
            Search results as text
  self.private_tools:
    type: variable
    agents: [agent.1]
    params:
      dynamic: "True"
  self.tools:
    type: variable
    agents: [agent.StakeholderAgent._stakeholder_agent, agent.0]
    params:
      dynamic: "True"
  send_message:
    type: decorator
    params:
      description: |-
        Send a message to another agent during task execution.

        Use this tool to communicate with other agents, ask questions,
        provide updates, or coordinate work. The message will be
        automatically linked to your current task.

        Args:
            to_agent_id: The ID of the agent you want to send the message to
            content: The message content
            message_type: Type of message - "direct", "request", "response", "status_update", "alert"

        Returns:
            Confirmation message

        Example:
            await send_message(
                to_agent_id="data_analyst_agent",
                content="Can you provide the latest metrics for the optimization task?",
                message_type="request"
            )
  take_break:
    type: decorator
    params:
      description: |-
        Take a break from work (human behavior simulation).

        Args:
            duration_minutes: Length of break in minutes

        Returns:
            Break completion message

