variables:
  ANTHROPIC_API_KEY:
    type: env
    params:
      caller: [os.environ]
  COHERE_API_KEY:
    type: env
    params:
      caller: [os.environ]
  EXA_API_KEY:
    type: env
    params:
      caller: [os.environ]
  MAG_MANAGER_MODE:
    type: env
    params:
      caller: [os.environ.get]
      path: [manager_agent_gym.core.manager_agent.factory]
  MAG_MAX_TIMESTEPS:
    type: env
    params:
      caller: [os.environ.get]
      path: [manager_agent_gym.config]
  MAG_MODEL_NAME:
    type: env
    params:
      caller: [os.environ.get]
      path: [manager_agent_gym.core.manager_agent.factory]
  MAG_OUTPUT_DIR:
    type: env
    params:
      caller: [os.environ.get]
      path: [manager_agent_gym.config]
  OPENAI_API_KEY:
    type: env
    params:
      caller: [os.environ, os.getenv, AsyncOpenAI]
      path: [manager_agent_gym.core.common.llm_interface]

files:
  ./simulation_outputs:
    type: literal
    actions: [read]
  .env:
    type: literal
    actions: [read]
  base_dir:
    type: variable
    actions: [read]
    params:
      caller: [Path()]
  ev_dir:
    type: variable
    actions: [write]
    params:
      caller: [ev_dir.mkdir]
  exec_dir:
    type: variable
    actions: [write]
    params:
      caller: [exec_dir.mkdir]
  execution_log_file:
    type: variable
    actions: [read]
    params:
      caller: [open, json.load]
      alias: [f]
  filepath:
    type: variable
    actions: [write]
    params:
      caller: [filepath.parent.mkdir, open]
  final_metrics.json:
    type: literal
    actions: [read]
    params:
      caller: [get_final_metrics_path]
      path: [self.timestep_dir]
  final_path:
    type: variable
    actions: [write]
    params:
      caller: [open]
      alias: [f]
  history_path:
    type: variable
    actions: [write]
    params:
      caller: [open]
      alias: [f]
  path:
    type: variable
    actions: [write]
    params:
      caller: [open]
      alias: [f]
  snapshot_dir:
    type: variable
    actions: [read]
    params:
      caller: [Path]
  timestep_file:
    type: variable
    actions: [read]
    params:
      caller: [open, json.load]
      alias: [f]
  wf_dir:
    type: variable
    actions: [write]
    params:
      caller: [wf_dir.mkdir]
